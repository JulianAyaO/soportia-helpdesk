spring.application.name=soportia-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/soportia}
spring.datasource.username=${DB_USER:soportia}
spring.datasource.password=${DB_PASSWORD:soportia_local}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
soportia.jwt.secret=${JWT_SECRET:local-development-secret-change-me-at-least-32-characters}
soportia.jwt.access-minutes=${JWT_ACCESS_MINUTES:15}
soportia.jwt.refresh-days=${JWT_REFRESH_DAYS:14}
soportia.n8n.routing-webhook-url=${N8N_ROUTING_WEBHOOK_URL:${N8N_WEBHOOK_URL:}}
soportia.n8n.sla-webhook-url=${N8N_SLA_WEBHOOK_URL:${N8N_WEBHOOK_URL:}}
soportia.n8n.hmac-secret=${N8N_HMAC_SECRET:local-automation-hmac-secret-change-me}
soportia.n8n.max-attempts=${N8N_MAX_ATTEMPTS:8}
soportia.n8n.publisher-delay-ms=${N8N_PUBLISHER_DELAY_MS:5000}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
soportia.attachments.dir=${ATTACHMENTS_DIR:./data/attachments}
