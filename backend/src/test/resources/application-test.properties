spring.datasource.url=jdbc:h2:mem:soportia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
soportia.jwt.secret=test-secret-that-is-at-least-thirty-two-bytes-long
soportia.n8n.hmac-secret=local-n8n-secret
soportia.n8n.routing-webhook-url=
soportia.n8n.sla-webhook-url=
soportia.n8n.publisher-delay-ms=600000
