server {
    listen 80;
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/self.crt;
    ssl_certificate_key /etc/nginx/certs/self.key;
    error_page 497 =301 https://$http_host$request_uri;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 15m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /soportia.crt {
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition "attachment; filename=soportia.crt";
        add_header Cache-Control "no-store";
    }

    location / {
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
    }
}
